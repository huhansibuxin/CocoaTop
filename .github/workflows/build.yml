name: Build CocoaTop (roothide)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # roothide 必须用官方 fork 的 theos（普通 theos 不认 roothide scheme）。
      # --recurse-submodules 会一并拉下 vendor/include (roothide/headers) 和
      # vendor/lib (roothide/lib)：源码里的 #import "roothide.h" / jbroot()
      # 就靠它们提供，不需要单独 curl 头文件。
      - name: Setup Theos (roothide)
        run: |
          git clone --recurse-submodules https://github.com/roothide/theos.git ${{ runner.temp }}/theos
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl|' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=roothide" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dpkg ldid

      # Makefile 里 TARGET = iphone:clang:14.5:8.0，必须装 14.5 SDK。
      # 不用 zip 包：14.5 SDK 内含 symlink，unzip 在新版 macOS runner 上会
      # 报 "symlink error: Permission denied"；改用 sparse-checkout（与 RainbowKeyboard 一致）。
      - name: Install SDK (iPhoneOS14.5)
        run: |
          set -euxo pipefail
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git "${{ runner.temp }}/sdks"
          cd "${{ runner.temp }}/sdks"
          git sparse-checkout set iPhoneOS14.5.sdk
          test -d iPhoneOS14.5.sdk
          cp -R iPhoneOS14.5.sdk "$THEOS/sdks/"

      - name: Build
        run: |
          cd src
          mkdir -p packages
          rm -f packages/*.deb
          # 上游源码有一处 tab 缩进(RootViewController.m:398)被新版 clang 的
          # -Wmisleading-indentation/-Werror 判为错误；保留 Makefile 原有的 -fobjc-arc 并关掉该警告。
          make package FINALPACKAGE=1 ADDITIONAL_OBJCFLAGS="-fobjc-arc -Wno-misleading-indentation"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CocoaTop-roothide
          path: src/packages/*.deb
